name: Verify local instrument
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  product:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: product
    env:
      ATA_REFERENCE_DIR: ${{ github.workspace }}/reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: product
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: product/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: 0.13.0
          python-version: 3.13.15
      - run: npm install --global npm@12.0.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run reference:prepare -- ../reference
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check:public
      - run: npm run verify
      - run: npm run report:portable
      - run: node scripts/public-surface.mjs --static apps/web/dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: product-verification
          path: product/verification/
          if-no-files-found: error
          retention-days: 14
